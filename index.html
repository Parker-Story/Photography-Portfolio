<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Wildlife Photography</title>
  <style>
    :root { --bg: #1b201c; --text: #e9e6dc; --muted: #9aa393; --line: #3a423b; --gap: 8px; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #eceae1; --text: #1f2620; --muted: #5d675b; --line: #c4c2b6; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Georgia, "Times New Roman", serif; line-height: 1.5; }
    a { color: inherit; }
    header, main { max-width: 1400px; margin: 0 auto; padding: 0 1.25rem; }
    header { padding-top: 3rem; padding-bottom: 1rem; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 400; letter-spacing: -0.01em; }
    h1 a { text-decoration: none; }
    header p { margin: 0.5rem 0 0; color: var(--muted); }
    main { padding-bottom: 3rem; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

    nav { display: flex; gap: 1.5rem; margin-top: 1.25rem; }
    nav a { text-decoration: none; color: var(--muted); padding-bottom: 2px; border-bottom: 2px solid transparent; }
    nav a[aria-current] { color: var(--text); border-bottom-color: var(--text); }

    /* Landing: species grid */
    .species-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; padding-top: 1rem; }
    .tile { display: block; text-decoration: none; }
    .tile img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    .tile .name { display: block; margin-top: 0.5rem; font-size: 1.25rem; }
    .tile .meta { display: block; color: var(--muted); font-size: 0.9rem; }

    /* Species page + diary */
    .back { display: inline-block; margin: 1rem 0 0.5rem; color: var(--muted); }
    h2 { margin: 0 0 1.5rem; font-size: clamp(1.75rem, 5vw, 2.5rem); font-weight: 400; }
    .day { border-top: 1px solid var(--line); padding-top: 1.25rem; margin-top: 2.5rem; }
    main > div > .day:first-of-type { margin-top: 1.5rem; }
    .day-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 1rem; }
    h3 { margin: 0; font-size: clamp(1.3rem, 4vw, 1.75rem); font-weight: 400; }
    .count { color: var(--muted); font-size: 0.9rem; }
    .loc { margin: 0.1rem 0 0.5rem; color: var(--muted); font-style: italic; }
    .note { margin: 0 0 0.75rem; max-width: 65ch; white-space: pre-line; }
    .sp-block { margin-top: 1.5rem; }
    h4 { margin: 0 0 0.25rem; font-size: 1.15rem; font-weight: 400; }
    .row { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: flex-start; }
    .row button { padding: 0; border: 0; background: none; cursor: zoom-in; min-width: 0; }
    .row img { display: block; width: 100%; height: auto; }

    /* Lightbox */
    dialog { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: rgba(0, 0, 0, 0.94); }
    dialog::backdrop { background: transparent; }
    dialog img { position: absolute; inset: 0; margin: auto; max-width: 96vw; max-height: 88vh; object-fit: contain; }
    dialog .ctl { position: absolute; background: none; border: 0; color: #fff; font-size: 2.5rem; line-height: 1; padding: 1rem; cursor: pointer; opacity: 0.8; }
    dialog .ctl:hover, dialog .ctl:focus-visible { opacity: 1; }
    #close { top: 0; right: 0; }
    #prev { left: 0; top: 50%; transform: translateY(-50%); }
    #next { right: 0; top: 50%; transform: translateY(-50%); }
    #lb-cap { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 0.75rem 1rem; text-align: center; color: #ddd; }
  </style>
</head>
<body>
  <header>
    <h1><a href="#">Wildlife Photography</a></h1>
    <p>Photos and notes from my local park.</p>
    <nav aria-label="Views">
      <a href="#" id="nav-species">By species</a>
      <a href="#dates" id="nav-dates">By date</a>
    </nav>
  </header>

  <main id="app"></main>

  <dialog id="lightbox" aria-label="Photo viewer">
    <button class="ctl" id="close" aria-label="Close">&times;</button>
    <button class="ctl" id="prev" aria-label="Previous photo">&#8249;</button>
    <img id="lb-img" alt="">
    <button class="ctl" id="next" aria-label="Next photo">&#8250;</button>
    <p id="lb-cap"></p>
  </dialog>

  <script>
    const app = document.getElementById('app');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCap = document.getElementById('lb-cap');
    const navSpecies = document.getElementById('nav-species');
    const navDates = document.getElementById('nav-dates');
    let photos = [], notes = {}, view = [], current = 0;

    const title = s => s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const day = p => p.taken.slice(0, 10);
    const fmt = (d, opts) => {
      const [y, m, dd] = d.split('-').map(Number);
      return new Date(y, m - 1, dd).toLocaleDateString(undefined, opts);
    };
    const LONG = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const SHORT = { year: 'numeric', month: 'short', day: 'numeric' };
    const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
    const thumb = p => `photos/thumb/${p.species}/${p.file}`;
    const full = p => `photos/full/${p.species}/${p.file}`;
    const el = (tag, props = {}, ...kids) => {
      const e = document.createElement(tag);
      Object.assign(e, props);
      e.append(...kids);
      return e;
    };

    // notes.json shape: { "YYYY-MM-DD": { location, note, species: { "slug": "note" } } }
    const outing = d => notes[d] || {};
    const speciesNote = (d, s) => (outing(d).species || {})[s];

    // Groups photos by capture date, newest day first; photos within a day in shot order
    function byDay(ps) {
      const days = {};
      ps.forEach(p => (days[day(p)] ||= []).push(p));
      return Object.keys(days).sort().reverse().map(d => ({
        d,
        group: days[d].sort((a, b) => a.taken.localeCompare(b.taken))
      }));
    }

    function dayHeader(d, count) {
      return el('div', { className: 'day-head' },
        el('h3', { textContent: fmt(d, LONG) }),
        el('span', { className: 'count', textContent: plural(count, 'photo') }));
    }

    function textP(className, text) {
      return el('p', { className, textContent: text });
    }

    // One justified row of photos; registers each photo in `view` for the lightbox
    function photoRow(group) {
      const row = el('div', { className: 'row' });
      group.forEach(p => {
        const i = view.push(p) - 1;
        const r = p.w / p.h;
        const btn = el('button', { type: 'button' },
          el('img', { src: thumb(p), width: p.w, height: p.h, alt: `${title(p.species)}, ${day(p)}`, loading: 'lazy' }));
        btn.style.cssText = `flex:${r} 1 ${Math.round(r * 200)}px;max-width:${Math.round(r * 360)}px`;
        btn.setAttribute('aria-label', `View ${title(p.species)} photo from ${day(p)}`);
        btn.addEventListener('click', () => openPhoto(i));
        row.append(btn);
      });
      return row;
    }

    function renderHome() {
      document.title = 'Wildlife Photography';
      view = [];
      const groups = {};
      photos.forEach(p => (groups[p.species] ||= []).push(p));
      const list = Object.entries(groups).map(([species, ps]) => {
        ps.sort((a, b) => b.taken.localeCompare(a.taken));
        return { species, ps };
      }).sort((a, b) => b.ps[0].taken.localeCompare(a.ps[0].taken));

      const grid = el('div', { className: 'species-grid' });
      list.forEach(({ species, ps }) => {
        grid.append(el('a', { href: '#' + species, className: 'tile' },
          el('img', { src: thumb(ps[0]), alt: '', loading: 'lazy' }),
          el('span', { className: 'name', textContent: title(species) }),
          el('span', { className: 'meta', textContent: `${plural(ps.length, 'photo')}, last seen ${fmt(day(ps[0]), SHORT)}` })
        ));
      });
      app.replaceChildren(grid);
    }

    function renderSpecies(species) {
      const ps = photos.filter(p => p.species === species);
      if (!ps.length) {
        app.replaceChildren(el('a', { href: '#', className: 'back', textContent: 'All species' }),
          el('p', { textContent: 'No photos found for that species.' }));
        return;
      }
      document.title = title(species) + ' | Wildlife Photography';
      view = [];
      const wrap = el('div', {},
        el('a', { href: '#', className: 'back', textContent: 'All species' }),
        el('h2', { textContent: title(species) }));

      byDay(ps).forEach(({ d, group }) => {
        const section = el('section', { className: 'day' }, dayHeader(d, group.length));
        const loc = outing(d).location;
        if (loc) section.append(textP('loc', loc));
        const sn = speciesNote(d, species);
        if (sn) section.append(textP('note', sn));
        section.append(photoRow(group));
        wrap.append(section);
      });
      app.replaceChildren(wrap);
    }

    function renderDiary() {
      document.title = 'By date | Wildlife Photography';
      view = [];
      const wrap = el('div');

      byDay(photos).forEach(({ d, group }) => {
        const o = outing(d);
        const section = el('section', { className: 'day' }, dayHeader(d, group.length));
        if (o.location) section.append(textP('loc', o.location));
        if (o.note) section.append(textP('note', o.note));

        const bySpecies = {};
        group.forEach(p => (bySpecies[p.species] ||= []).push(p));
        Object.entries(bySpecies).forEach(([s, ps]) => {
          const block = el('div', { className: 'sp-block' },
            el('h4', {}, el('a', { href: '#' + s, textContent: title(s) })));
          const sn = speciesNote(d, s);
          if (sn) block.append(textP('note', sn));
          block.append(photoRow(ps));
          section.append(block);
        });
        wrap.append(section);
      });
      app.replaceChildren(wrap);
    }

    function route() {
      const h = decodeURIComponent(location.hash.slice(1));
      navSpecies.removeAttribute('aria-current');
      navDates.removeAttribute('aria-current');
      if (h === 'dates') {
        navDates.setAttribute('aria-current', 'page');
        renderDiary();
      } else {
        navSpecies.setAttribute('aria-current', 'page');
        h ? renderSpecies(h) : renderHome();
      }
      window.scrollTo(0, 0);
    }

    function show(i) {
      current = (i + view.length) % view.length;
      const p = view[current];
      const loc = outing(day(p)).location;
      lbImg.src = full(p);
      lbImg.alt = `${title(p.species)}, ${day(p)}`;
      lbCap.textContent = `${title(p.species)}, ${fmt(day(p), SHORT)}${loc ? ', ' + loc : ''}`;
    }
    function openPhoto(i) { show(i); lightbox.showModal(); }

    document.getElementById('close').addEventListener('click', () => lightbox.close());
    document.getElementById('prev').addEventListener('click', () => show(current - 1));
    document.getElementById('next').addEventListener('click', () => show(current + 1));
    lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.close(); });
    document.addEventListener('keydown', e => {
      if (!lightbox.open) return;
      if (e.key === 'ArrowLeft') show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
    });

    Promise.all([
      fetch('photos.json').then(r => r.json()),
      fetch('notes.json').then(r => r.json()).catch(() => ({}))
    ]).then(([p, n]) => {
      photos = p;
      notes = n;
      route();
      window.addEventListener('hashchange', route);
    }).catch(() => {
      app.textContent = 'Could not load photos.json. If you opened this file directly, run a local server instead (python -m http.server 8080).';
    });
  </script>
</body>
</html>
